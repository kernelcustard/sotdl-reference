<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17130f">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Shadow of the Demon Lord Reference</title>
  <link rel="stylesheet" href="styles.css?v=__BUILD_VERSION__">
</head>
<body>
  <header class="site-header">
    <div class="shell">
      <p class="eyebrow">Quick reference</p>
      <h1>Shadow of the Demon Lord</h1>
      <p class="intro">Search concise rules summaries or generate reproducible settlement stock.</p>
      <nav class="view-tabs" aria-label="Application sections">
        <button class="view-tab" type="button" data-view="rules-view" aria-pressed="true">Rules</button>
        <button class="view-tab" type="button" data-view="shop-view" aria-pressed="false">Stock generator</button>
      </nav>
    </div>
  </header>

  <main class="shell main-content">
    <section id="rules-view" class="app-view">
      <label class="search-label" for="search">Search rules</label>
      <input id="search" class="search" type="search" placeholder="Try frightened, range, shadows…" autocomplete="off">
      <div id="categories" class="categories" aria-label="Rule categories"></div>
      <p id="result-count" class="result-count"></p>
      <section id="rules" class="rules" aria-live="polite"></section>
      <p id="empty-state" class="empty-state" hidden>No matching rules.</p>
    </section>

    <section id="shop-view" class="app-view" hidden>
      <div class="shop-controls compact-panel">
        <label class="compact-field">
          <span>Settlement</span>
          <select id="shop-settlement"></select>
        </label>
        <label class="compact-field">
          <span>Breadth</span>
          <select id="stock-breadth">
            <option value="standard">Standard</option>
            <option value="broad" selected>Broad restock</option>
            <option value="extensive">Extensive</option>
          </select>
        </label>

        <fieldset class="shop-picker compact-picker">
          <legend>Businesses</legend>
          <div id="shop-options" class="shop-options compact-shop-options"></div>
          <div class="shop-picker-actions micro-actions">
            <button id="select-all-shops" type="button">All</button>
            <button id="clear-shops" type="button">None</button>
          </div>
        </fieldset>

        <label class="seed-control seed-inline">
          <span>Seed</span>
          <input id="shop-seed" type="text" autocomplete="off" spellcheck="false" placeholder="Enter or generate a seed">
        </label>
        <div class="button-row compact-actions">
          <button id="generate-shop" class="primary-button" type="button">Generate</button>
          <button id="new-seed" type="button">New seed</button>
          <button id="copy-seed" type="button">Copy seed</button>
          <button id="copy-link" type="button">Share</button>
        </div>
      </div>

      <p id="shop-status" class="shop-status" aria-live="polite">Loading shop data…</p>

      <section id="shop-results" hidden>
        <div class="shop-results-header compact-results-header">
          <div>
            <h2 id="shop-title">Settlement Stock</h2>
            <p id="shop-key" class="shop-key"></p>
          </div>
          <button id="copy-list" type="button">Copy list</button>
        </div>

        <div class="stock-toolbar">
          <label class="stock-search" for="item-query">
            <span class="visually-hidden">Search stock</span>
            <input id="item-query" type="search" placeholder="Search stock…" autocomplete="off">
          </label>

          <details class="toolbar-menu" id="filter-menu">
            <summary title="Filter item types" aria-label="Filter item types">
              <span aria-hidden="true">⚗</span>
            </summary>
            <div class="toolbar-popover">
              <strong>Item types</strong>
              <div id="category-filters" class="category-filter-list"></div>
              <div class="micro-actions">
                <button id="select-all-categories" type="button">All</button>
                <button id="clear-categories" type="button">None</button>
              </div>
            </div>
          </details>

          <details class="toolbar-menu" id="sort-menu">
            <summary title="Sort stock" aria-label="Sort stock">
              <span aria-hidden="true">⇅</span>
            </summary>
            <div class="toolbar-popover sort-options">
              <strong>Sort by</strong>
              <label><input type="radio" name="stock-sort" value="name" checked> Name</label>
              <label><input type="radio" name="stock-sort" value="type"> Type</label>
              <label><input type="radio" name="stock-sort" value="location"> Location</label>
            </div>
          </details>
        </div>

        <p id="item-check-result" class="check-result" aria-live="polite"></p>
        <p id="visible-stock-count" class="result-count"></p>
        <div id="stock-list" class="stock-list compact-stock-list" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <footer class="shell site-footer">
    <p>Unofficial personal reference. Check the cited rulebook page when wording matters.</p>
  </footer>

  <script src="data/rules.js?v=__BUILD_VERSION__"></script>
  <script src="data/core-combat-rules.js?v=__BUILD_VERSION__"></script>
  <script src="app.js?v=__BUILD_VERSION__"></script>
  <script src="shop.js?v=__BUILD_VERSION__"></script>
</body>
</html>
